const hex = h => { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const m4 = v => ((Math.trunc(v) % 4) + 4) % 4;
const dither = (x, y, t) => t * 16 > BAYER[m4(y)][m4(x)] + 0.5;
const rand = (a, b) => a + Math.random() * (b - a);
const randint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function seeded(seed) {           // mulberry32
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function px(x, y, col) { ctx.fillStyle = css(col); ctx.fillRect(Math.trunc(x), Math.trunc(y), 1, 1); }

function layer(w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); const id = g.createImageData(w, h);
  return {
    set(x, y, col) {
      x = Math.trunc(x); y = Math.trunc(y);
      if (x < 0 || y < 0 || x >= w || y >= h) return;
      const i = (y * w + x) * 4;
      id.data[i] = col[0]; id.data[i + 1] = col[1]; id.data[i + 2] = col[2]; id.data[i + 3] = 255;
    },
    done() { g.putImageData(id, 0, 0); return c; },
  };
}

  const pix = []; let cx = x;
  for (const ch of text) {
    const g = glyph(ch);
    g.forEach((row, gy) => [...row].forEach((c, gx) => { if (c === "1") pix.push([cx + gx * scale, y + gy * scale]); }));

// ---------------------------------------------------------------- sound (Web Audio)
let AC = null, muted = false;
function unlockAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === "suspended") AC.resume();
}
function tone(f0, f1, t, dur, vol, type = "sine") {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function play(name) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  if (name === "pop") tone(1100, 400, t, 0.09, 0.3);
  if (name === "yes") [523, 659, 784, 1047, 1319].forEach((f, k) => { tone(f, f, t + k * 0.11, 0.45, 0.18); tone(f * 2, f * 2, t + k * 0.11, 0.3, 0.05); });
  if (name === "no") [392, 349, 311, 262].forEach((f, k) => tone(f, f, t + k * 0.18, 0.5, 0.18, "triangle"));
  if (name === "thunder") {
    const n = Math.floor(AC.sampleRate * 1.2), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { const tt = i / n; d[i] = (Math.random() * 2 - 1) * Math.min(1, tt * 20) * Math.pow(1 - tt, 1.5); }
    const s = AC.createBufferSource(); s.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 280;
    const g = AC.createGain(); g.gain.value = 1.2;
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
  }
}

// ---------------------------------------------------------------- sprites
const P_PINK = ["#fff0f5", "#ffc6da", "#ff93b8", "#e25e90", "#9a3563"].map(hex);
const P_GRAY = ["#d9d0dc", "#b7aabd", "#958aa0", "#7a6d86", "#4b4058"].map(hex);
const petalCache = new Map();

function petalSprite(angle, squash = 1, gray = false) {
  const q = ((Math.round(angle / (2 * Math.PI) * 64) % 64) + 64) % 64;
  const key = q + "|" + squash + "|" + gray;
  if (petalCache.has(key)) return petalCache.get(key);
  const ang = q / 64 * 2 * Math.PI, a = PETAL_A, b = PETAL_B * squash;
  const size = Math.trunc(a * 2 + 4), c = size / 2, ca = Math.cos(ang), sa = Math.sin(ang);
  const [light, soft, mid, deep, line] = gray ? P_GRAY : P_PINK;
  const L = layer(size, size);
  const shape = (dx, dy) => {
    const u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
    const bb = b * (0.55 + 0.45 * Math.min(1, (u + a) / (a * 1.1)));
    let d = (u / a) ** 2 + (v / bb) ** 2;
    if (u > a * 0.7 && Math.abs(v) < (u - a * 0.7) * 1.1) d = 2;
    return [d, u, v];
  };
  for (let py = 0; py < size; py++) for (let pxx = 0; pxx < size; pxx++) {
    const dx = pxx + 0.5 - c, dy = py + 0.5 - c;
    const [d, u, v] = shape(dx, dy);
    if (d > 1) continue;
    let col;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([ox, oy]) => shape(dx + ox, dy + oy)[0] > 1)) col = line;
    else {
      const t = (u + a) / (2 * a);
      if (t < 0.3) col = light;
      else if (t < 0.5) col = dither(pxx, py, (t - 0.3) / 0.2) ? soft : light;
      else if (t < 0.75) col = dither(pxx, py, (t - 0.5) / 0.25) ? mid : soft;
      else col = mid;
      if (d > 0.72 && v > 0) col = deep;
    }
    L.set(pxx, py, col);
  }
  const s = L.done(); petalCache.set(key, s); return s;
}

function heartSprite(rows, col, hi, line) {
  const L = layer(rows[0].length, rows.length);
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === "X") L.set(x, y, col); else if (ch === "H") L.set(x, y, hi); else if (ch === "O" && line) L.set(x, y, line);
  }));
  return L.done();
}
const SMALL_HEART = [".XX.XX.", "XHXXXXX", "XXXXXXX", ".XXXXX.", "..XXX..", "...X..."];
const BIG_HEART = [".OOO...OOO.", "OXXXO.OXXXO", "OXHHXOXXXXO", "OXHXXXXXXXO", "OXXXXXXXXXO",

// ---------------------------------------------------------------- scenery
function inWindow(x, y, grow = 0) {
  if (WIN_L - grow <= x && x <= WIN_RX + grow && WIN_CY <= y && y <= WIN_B + grow) return true;
  return y < WIN_CY && Math.hypot(x - WIN_CX, y - WIN_CY) <= WIN_RAD + grow;
}

function buildOutside() {
  const L = layer(W, H), rnd = seeded(5), ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const sky = ["#22113f", "#3b1a5c", "#62276f", "#963878", "#c94e74", "#ea7262", "#ffa463"].map(hex);
  const top = 40, bot = 215;
  for (let y = 0; y < H; y++) {
    const t = Math.max(0, Math.min(1, (y - top) / (bot - top))) * (sky.length - 1);
    const i = Math.min(Math.trunc(t), sky.length - 2);
    for (let x = 0; x < W; x++) L.set(x, y, dither(x, y, t - i) ? sky[i + 1] : sky[i]);
  }
  const sx = 108, sy = 182, sr = 15;
  for (let y = sy - 34; y <= sy; y++) for (let x = sx - 34; x < sx + 35; x++) {
    const d = Math.hypot(x - sx, y - sy);
    if (d <= sr) {
      let col = d < sr - 3 ? hex("#ffe6a0") : hex("#ffc977");
      if (d > sr - 3 && Math.floor(y / 2) % 2 === 0 && y > sy - 9) col = hex("#ff9a5c");
      L.set(x, y, col);
    } else if (d < 34 && dither(x, y, Math.pow(1 - (d - sr) / 19, 1.7) * 0.7)) L.set(x, y, hex("#ffb27a"));
  }
  for (const [cy, cx, ln] of [[88, 40, 50], [120, 95, 40], [150, 30, 36], [70, 92, 30]])
    for (let k = 0; k < ln; k++) for (let dy = 0; dy < 3; dy++) {
      const x = cx + k - Math.floor(ln / 2) + dy * 2;
      if (x >= 0 && x < W && dither(x, cy + dy, 0.6 - Math.abs(k - ln / 2) / ln))
        L.set(x, cy + dy, dy === 0 ? hex("#e47a8e") : hex("#b44f7f"));
    }
  const lights = [];
  [[hex("#4a2052"), 168, 196, hex("#c97a7a")], [hex("#1d0f2b"), 182, 210, hex("#ffcf7a")]].forEach(([col, lo, hi, lit], layerN) => {
    let x = ri(-10, 0);
    while (x < W) {
      const w = ri(9, 20), topY = ri(lo, hi);
      for (let xx = Math.max(0, x); xx < Math.min(W, x + w); xx++) for (let yy = topY; yy < WIN_B + 2; yy++) L.set(xx, yy, col);
      if (rnd() < 0.3) { const ax = x + Math.floor(w / 2); for (let yy = topY - 6; yy < topY; yy++) if (ax >= 0 && ax < W) L.set(ax, yy, col); }
      for (let wy = topY + 3; wy < WIN_B; wy += 4) for (let wx = x + 2; wx < x + w - 2; wx += 3)
        if (wx >= 0 && wx < W && rnd() < 0.35) { L.set(wx, wy, lit); if (layerN === 1) lights.push([wx, wy]); }
      x += w + ri(0, 3);
    }
  });
  return [L.done(), lights];
}

function buildRoom() {
  const L = layer(W, H);
  const [wall, wall2, wallD] = ["#2c1c36", "#35233f", "#1d1226"].map(hex);
  const [frame, frameHi, frameLo] = ["#e6d1b6", "#fff1dc", "#a88d75"].map(hex);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (inWindow(x, y)) continue;
    if (inWindow(x, y, 4)) {
      let col = !inWindow(x, y, 1) ? (x < WIN_CX ? frameHi : frame) : frame;
      if (!inWindow(x, y, 3)) col = frameLo;
      L.set(x, y, col); continue;
    }
    let col = (Math.floor(x / 4) % 3 === 0 && dither(x, y, 0.5)) ? wall2 : wall;
    const edge = Math.max(Math.abs(x - W / 2) / (W / 2), Math.abs(y - H / 2) / (H / 2));
    if (dither(x, y, Math.max(0, edge - 0.6) * 2.2)) col = wallD;
    L.set(x, y, col);
  }
  for (let y = SILL_Y + 8; y < H; y++) for (let x = 0; x < W; x++) {
    const f = Math.max(0, 1 - Math.abs(x - 80) / 70) * Math.max(0, 1 - (y - SILL_Y - 8) / 50) * 0.45;
    if (dither(x, y, f)) L.set(x, y, hex("#4a2b46"));
  }
  for (let x = 10; x < W - 10; x++) {
    L.set(x, SILL_Y - 1, frameHi);
    for (let y = SILL_Y; y < SILL_Y + 3; y++) L.set(x, y, frame);
    for (let y = SILL_Y + 3; y < SILL_Y + 9; y++) L.set(x, y, dither(x, y, 0.3) ? frame : frameLo);
    L.set(x, SILL_Y + 9, hex("#5f4b46"));
    for (let y = SILL_Y + 10; y < SILL_Y + 13; y++) if (dither(x, y, 0.6 - (y - SILL_Y - 10) * 0.2)) L.set(x, y, wallD);
  }
  return L.done();
}

function buildPot() {
  const L = layer(W, H);
  const [rim, body, shade, hi, dark] = ["#e9875a", "#c95f39", "#9b4529", "#f6aa7c", "#6e2d1c"].map(hex);
  const top = 203, bot = SILL_Y;
  for (let y = top; y < bot; y++) {
    const t = (y - top) / (bot - top), half = 14 - 4 * t;
    for (let x = Math.trunc(80 - half); x <= Math.trunc(80 + half); x++) {
      const rel = (x - (80 - half)) / (2 * half);
      let col = body;
      if (rel > 0.68 && dither(x, y, (rel - 0.68) * 3)) col = shade;
      if (rel > 0.15 && rel < 0.24) col = hi;
      if (rel > 0.93 || y === bot - 1) col = dark;
      L.set(x, y, col);
    }
  }
  for (let y = top - 5; y < top; y++) for (let x = 63; x < 98; x++) {
    let col = rim;
    if (y === top - 5) col = hi; else if (y === top - 1 || x === 63 || x === 97) col = shade;
    L.set(x, y, col);
  }
  const c = L.done();
  c.getContext("2d").drawImage(heartSprite(SMALL_HEART, hex("#fff0dc"), hex("#ffffff")), 77, 212);
  return c;
}

// ---------------------------------------------------------------- game objects
class Petal {
  constructor(angle) {
    this.angle = angle; this.x = 0; this.y = 0; this.state = "on"; this.t = 0;
    this.phase = Math.random() * 6.28; this.vx = 0; this.vy = 0; this.spin = 0; this.landY = 0;
  }
  hit(mx, my) {
    const dx = mx - this.x, dy = my - this.y;
    const u = dx * Math.cos(this.angle) + dy * Math.sin(this.angle);
    const v = -dx * Math.sin(this.angle) + dy * Math.cos(this.angle);
    return (u / (PETAL_A + 2)) ** 2 + (v / (PETAL_B + 3)) ** 2 <= 1;   // a bit bigger for fingers
  }
  pluck() {
    this.state = "fall";
    this.vx = Math.cos(this.angle) * 1.1;
    this.vy = Math.sin(this.angle) * 0.8 - 1.0;
    this.spin = (Math.random() < 0.5 ? -1 : 1) * rand(0.05, 0.1);
    this.landY = SILL_Y - rand(1, 3);
  }
  update() {
    if (this.state !== "fall") return;
    this.t++;
    this.vy = Math.min(this.vy + 0.03, 0.75);
    this.vx *= 0.975;
    this.x += this.vx + Math.sin(this.t * 0.07 + this.phase) * 0.5;
    this.x = Math.max(16, Math.min(W - 16, this.x));
    this.y += this.vy;
    this.angle += this.spin;
    if (this.y >= this.landY) {
      this.state = "ground"; this.y = this.landY;
      this.angle = rand(-0.25, 0.25) + (Math.random() < 0.5 ? 0 : Math.PI);
    }
  }
  draw(gray = false) {
    const s = petalSprite(this.angle, this.state === "ground" ? 0.6 : 1, gray);
    ctx.drawImage(s, Math.round(this.x - s.width / 2), Math.round(this.y - s.height / 2));
  }
}

function pluck(p) {

  if (navigator.vibrate) navigator.vibrate(10);
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * 6.28, sp = rand(0.4, 1.3);
    G.sparks.push([p.x, p.y, Math.cos(a) * sp, Math.sin(a) * sp, randint(12, 24)]);
  }
  if (!remaining().length) { G.done = true; G.endT = 0; }
}

function click(mx, my) {
  if (G.done) { if (G.endT > 60) reset(); return; }
  const on = remaining();
  for (let i = on.length - 1; i >= 0; i--) if (on[i].hit(mx, my)) { pluck(on[i]); return; }
}

// ---------------------------------------------------------------- update
function update() {
  G.frame++; G.textT++;
  G.petals.forEach(p => p.update());
  for (const s of G.sparks) { s[0] += s[2]; s[1] += s[3]; s[2] *= 0.92; s[3] *= 0.92; s[4]--; }
  G.sparks = G.sparks.filter(s => s[4] > 0);

  if (G.done) {
    G.endT++;
    if (G.endT === 25) play(G.loves ? "yes" : "no");
    if (G.loves) {
      G.rainAmount = Math.max(0, G.rainAmount - 0.5);
      if (G.endT > 20 && G.frame % 7 === 0)
        G.floaters.push([FLOWER_X + rand(-10, 10), FLOWER_Y, Math.random() * 6.28, rand(0.3, 0.55), randint(0, 1)]);
    } else {
      G.rainAmount = Math.min(110, G.rainAmount + 1);
      if (G.endT > 40 && Math.random() < 0.006 && G.flash <= 0) { G.flash = 10; play("thunder"); }
    }
  }
  G.flash--;
  while (G.rain.length < G.rainAmount) G.rain.push([rand(0, W + 40), rand(30, 60)]);
  const heavy = 1 + (G.rainAmount > 60 ? 1 : 0);
  for (const r of G.rain) { r[0] -= 0.8 * heavy; r[1] += 3.2 * heavy; }
  G.rain = G.rain.filter(r => r[1] < WIN_B).slice(0, Math.trunc(G.rainAmount));

  for (const g of G.glass) {
    g[3]--;
    if (g[3] < 0) { g[1] += g[2] * 6; if (Math.random() < 0.02) g[3] = randint(20, 120); }
    if (g[1] > WIN_B) { g[0] = rand(WIN_L, WIN_RX); g[1] = rand(45, 120); g[3] = randint(0, 150); }
  }
  for (const f of G.floaters) { f[1] -= f[3]; f[0] += Math.sin(G.frame * 0.05 + f[2]) * 0.4; }
  G.floaters = G.floaters.filter(f => f[1] > -8);
}

// ---------------------------------------------------------------- render
function drawPlant() {
  const sway = Math.sin(G.frame * 0.025) * 0.8;
  const droop = (G.done && !G.loves) ? Math.min(G.endT / 80, 1) : 0;
  const cx = FLOWER_X + sway + droop * 9, cy = FLOWER_Y + droop * 14;
  const [stem, stemD, stemL] = ["#4aa34a", "#2a6b33", "#86d66b"].map(hex);
  const baseY = 199;
  for (let i = 0; i < 140; i++) {
    const t = i / 139;
    const x = (1 - t) ** 2 * 80 + 2 * (1 - t) * t * (78 - droop * 2) + t * t * cx;
    const y = (1 - t) ** 2 * baseY + 2 * (1 - t) * t * 165 + t * t * cy;
    px(Math.trunc(x) - 1, y, stemD);
    px(x, y, stem);
    px(Math.trunc(x) + 1, y, Math.trunc(y) % 4 ? stemL : stem);
  }
  for (const [ly, side] of [[185, -1], [172, 1]]) {
    for (let i = 0; i < 16; i++) {
      const w = Math.pow(Math.sin(i / 15 * Math.PI), 0.8) * 4, iw = Math.trunc(w);
      const x0 = 79 + side * (i + 1);
      const y0 = ly - i * 0.45 + (i / 15) ** 2 * 3 * (1 + droop);
      for (let k = -iw; k <= iw; k++) {
        let col = k < 0 ? stemL : stem;
        if (Math.abs(k) === iw || (k === 0 && i > 2)) col = stemD;
        px(x0, y0 + k, col);
      }
    }
  }
  const on = remaining();
  for (const p of on) {
    p.x = cx + Math.cos(p.angle) * PETAL_DIST;
    p.y = cy + Math.sin(p.angle) * PETAL_DIST;
    if (on.length === 1 && Math.floor(G.frame / 8) % 2 === 0) {
      for (let a = 0; a < 360; a += 30) {
        const r = a * Math.PI / 180;
        px(p.x + Math.cos(r) * (PETAL_A + 2), p.y + Math.sin(r) * (PETAL_B + 3), [255, 240, 200]);
      }
    }
    p.draw();
  }
  if (G.done && G.loves && G.endT > 15) {
    const pulse = 1 + (Math.floor(G.endT / 12) % 2 === 0 ? 0.25 : 0);
    const w = Math.trunc(11 * pulse), h = Math.trunc(10 * pulse);
    ctx.drawImage(BIG, Math.trunc(cx - w / 2), Math.trunc(cy - h / 2), w, h);
    return;
  }
  const gray = G.done && !G.loves;
  const [c1, c2, c3, c4] = (gray ? ["#7d6a6a", "#5d4d55", "#3e3140", "#a89a94"]
                                 : ["#ffcf4a", "#e89a22", "#8a3d2a", "#fff3a8"]).map(hex);
  for (let y = -CENTER_R - 1; y < CENTER_R + 2; y++) for (let x = -CENTER_R - 1; x < CENTER_R + 2; x++) {
    const d = Math.hypot(x, y);
    if (d > CENTER_R + 0.4) continue;
    const X = Math.trunc(cx + x), Y = Math.trunc(cy + y);
    let col;
    if (d > CENTER_R - 0.8) col = c3;
    else if (d > CENTER_R - 3) col = dither(X, Y, 0.5) ? c2 : c1;
    else col = ((((x + 2 * y) % 4) + 4) % 4) ? c1 : c2;
    if (x > -4 && x < 0 && y > -4 && y < 0 && (((x + y) % 2) + 2) % 2 === 0) col = c4;
    px(X, Y, col);
  }
}

function drawCard(lines) {
  const t = G.endT - 70, h = lines.length * 16 + 10;
  const top = 76 - Math.floor(h / 2) + Math.max(0, 12 - t);
  const x0 = 12, x1 = W - 12, border = G.loves ? YES_COL : NO_COL;
  ctx.fillStyle = css(INK); ctx.fillRect(x0, top, x1 - x0, h);
  ctx.fillStyle = "rgb(44,24,56)"; ctx.fillRect(x0 + 2, top + 2, x1 - x0 - 4, h - 4);
  ctx.fillStyle = css(border);
  ctx.fillRect(x0, top, x1 - x0, 1); ctx.fillRect(x0, top + h - 1, x1 - x0, 1);
  ctx.fillRect(x0, top, 1, h); ctx.fillRect(x1 - 1, top, 1, h);
  let shown = Math.floor(t / 3), y = top + 6;
  for (const line of lines) {
    const chars = [...line], part = chars.slice(0, Math.max(0, shown)).join("");
    shown -= chars.length;
    if (part) drawText(part, Math.floor((W - textWidth(line, 2)) / 2), y, 2, [255, 240, 246]);
    y += 16;
  }
}

function render() {
  ctx.drawImage(OUTSIDE, 0, 0);
  CITY_LIGHTS.forEach(([x, y], i) => { if (Math.sin(G.frame * 0.01 + i * 1.7) > 0.93) px(x, y, hex("#1d0f2b")); });
  for (const r of G.rain) for (let k = 0; k < 4; k++) px(r[0] + k * 0.25, r[1] - k, k ? [214, 170, 214] : [240, 210, 240]);
  if (G.flash > 0 && G.flash % 4 !== 1) { ctx.fillStyle = "rgb(236,226,255)"; ctx.fillRect(0, 0, W, H); }
  for (const [x, y] of G.glass) {
    if (inWindow(Math.trunc(x), Math.trunc(y))) {
      px(x, y, [255, 230, 245]);
      px(x, Math.trunc(y) + 1, [170, 120, 170]);
      for (let k = 2; k < 6; k++) if (dither(x, y + k, 0.5 - k * 0.08)) px(x, Math.trunc(y) - k, [200, 150, 200]);
    }
  }
  ctx.drawImage(ROOM, 0, 0);
  const bulbs = [[255, 210, 120], [255, 150, 190], [170, 220, 255]];
  for (let i = 0, ang = 195; ang < 346; ang += 10, i++) {
    const a = ang * Math.PI / 180;
    const x = Math.trunc(WIN_CX + Math.cos(a) * (WIN_RAD + 8)), y = Math.trunc(WIN_CY + Math.sin(a) * (WIN_RAD + 8) + 2);
    px(x, y - 1, [60, 45, 60]);
    const col = bulbs[i % 3];
    if (Math.sin(G.frame * 0.06 + i * 1.3) > -0.2) {
      ctx.fillStyle = css(col); ctx.fillRect(x, y, 2, 2);
      if (dither(x, y, 0.5)) px(x - 1, y, col.map(c => c >> 1));
    } else { ctx.fillStyle = css(col.map(c => Math.floor(c / 3))); ctx.fillRect(x, y, 2, 2); }
  }
  const gray = G.done && !G.loves;
  G.petals.forEach(p => { if (p.state === "ground") p.draw(gray); });
  drawPlant();
  ctx.drawImage(POT, 0, 0);
  G.petals.forEach(p => { if (p.state === "fall") p.draw(); });
  for (const s of G.sparks) px(s[0], s[1], s[4] > 10 ? [255, 255, 255] : [255, 170, 205]);
  for (const f of G.floaters) ctx.drawImage(SMALL_HEARTS[f[4]], Math.trunc(f[0]) - 3, Math.trunc(f[1]) - 3);

  if (G.loves !== null) {
    const lines = TEXTS[G.lang][G.loves ? "yes" : "no"], col = G.loves ? YES_COL : NO_COL;
    let shown = Math.floor(G.textT / 2), y = lines.length === 2 ? 8 : 18;
    for (const line of lines) {
      const part = [...line].slice(0, Math.max(0, shown)).join("");
      shown -= [...line].length;
      if (part) drawText(part, Math.floor((W - textWidth(line, 2)) / 2), y, 2, col);
      y += 18;
    }
  }
  if (G.done && G.endT > 70) drawCard(G.loves ? WIN_MSG : LOSE_MSG);
  if (G.hints) {
    const hint = G.done ? (G.endT > 60 ? "TAP TO PLAY AGAIN" : "") : (G.plucked === 0 ? "TAP A PETAL" : "");
    if (hint && Math.floor(G.frame / 30) % 2 === 0)
      drawText(hint, Math.floor((W - textWidth(hint, 1)) / 2), H - 22, 1, [240, 225, 240]);
  }
}

// ---------------------------------------------------------------- input + loop
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = Math.floor(W * s) + "px";
  cv.style.height = Math.floor(H * s) + "px";
}
window.addEventListener("resize", fit); fit();

cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  unlockAudio();
  const r = cv.getBoundingClientRect();
  click((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
});
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
window.addEventListener("keydown", e => {
  unlockAudio();
  const k = e.key.toLowerCase();
  if (k === "r") reset();
  else if (k === "l") G.lang = G.lang === "en" ? "gr" : "en";
  else if (k === "h") G.hints = !G.hints;
  else if (k === "m") muted = !muted;
  else if (k === " ") {
    e.preventDefault();
    if (G.done) reset(); else { const on = remaining(); if (on.length) pluck(on[randint(0, on.length - 1)]); }
  }
});

reset();
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(250, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }      // fixed 60 updates/s (also on 120Hz iPhones)
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
