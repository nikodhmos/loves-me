name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygame pyinstaller
      - run: pyinstaller --onefile --windowed --name LovesMe LovesMe.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Loves Me
          files: dist/LovesMe.exe
          make_latest: true
